name: Deploy (GitHub Pages)

# main の内容を gh-pages ブランチへ公開。PR プレビュー（pr-preview/）は消さない
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: public/mediapipe/models
          key: mediapipe-model-v1
      # YOLO-pose のモデル（公式の重みから変換。キャッシュがなければ 1〜2 分かかる）
      - uses: ./.github/actions/yolo-model
      - run: npm run build
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
      - name: 公開されたか確認
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          url="https://${OWNER,,}.github.io/${REPO}/"
          # 今回のビルドの JS ファイル名（ハッシュ付き）が本番の index.html に載るまで待つ
          expected=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)
          for i in $(seq 1 40); do
            if curl -fsS "$url?t=$i" | grep -q "$expected"; then
              echo "✅ 公開を確認しました: $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::10 分待っても $url に今回のビルド（$expected）が反映されませんでした。Settings → Pages の公開元が gh-pages ブランチになっているか確認してください"
          exit 1

name: E2E

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: public/mediapipe/models
          key: mediapipe-model-v1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright (Android / iPhone 画面)
        run: npx playwright test --grep-invert @pose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            test-results
            playwright-report
          retention-days: 14

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    ignore:
      # Gradle 9.6+ は Capacitor が使う Android Gradle Plugin 8.x と非互換（PR #6）。Capacitor の対応後に外す
      - dependency-name: gradle-wrapper
        update-types: [version-update:semver-major]

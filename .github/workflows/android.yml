name: Android APK

# Capacitor で Web アプリを包んで APK を作る。
# push / PR: debug APK を artifact に。release.yml から呼ばれたとき: 署名済み release APK + AAB。
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

concurrency:
  group: android-${{ github.ref }}-${{ inputs.release || false }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: public/mediapipe/models
          key: mediapipe-model-v1
      # YOLO-pose のモデル（公式の重みから変換。キャッシュがなければ 1〜2 分かかる）
      - uses: ./.github/actions/yolo-model
      - name: Web ビルド & Android へ同期
        run: npm run cap:sync
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: バージョンを決定
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF_NAME#v}"; else name="$(node -p 'require("./package.json").version')-${GITHUB_SHA::7}"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: 署名鍵を復元
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 が未設定のため debug 鍵で署名します"
          fi

      - name: Gradle ビルド
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          tasks="assembleDebug"
          if [ "${{ inputs.release }}" = "true" ]; then tasks="assembleRelease bundleRelease"; fi
          ./gradlew $tasks -PversionCode=${{ github.run_number }} -PversionName=${{ steps.ver.outputs.name }}

      - name: 成果物を集める
        run: |
          mkdir -p out
          find android/app/build/outputs -name '*.apk' -exec cp {} out/ \;
          find android/app/build/outputs -name '*.aab' -exec cp {} out/ \;
          cd out && for f in *; do mv "$f" "crimb-${{ steps.ver.outputs.name }}-$f"; done && ls -la
          echo "### 📦 APK" >> "$GITHUB_STEP_SUMMARY"
          ls -1 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release && 'android-release' || 'android-debug' }}
          path: out

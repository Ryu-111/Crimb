name: Pose regression

# 解析ロジックや姿勢推定を変更したときに、実際の登攀動画で指標が崩れていないか確認する
on:
  pull_request:
    paths:
      - 'src/pose/**'
      - 'src/analysis/**'
      - 'test-fixtures/**'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'src/pose/**'
      - 'src/analysis/**'
      - 'test-fixtures/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 合成クライマーでの解析テスト
        run: npx vitest run src/analysis
      - uses: actions/cache@v4
        with:
          path: public/mediapipe/models
          key: mediapipe-model-v1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: 実動画での解析 (test-fixtures/)
        # 動画が未配置ならテスト 0 件で成功扱い（合成データのテストは上のステップで実行済み）
        run: npx playwright test --grep @pose --project android --pass-with-no-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pose-results
          path: |
            pose-results
            test-results
          if-no-files-found: ignore

name: Lighthouse

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: public/mediapipe/models
          key: mediapipe-model-v1
      - run: npm run build
      - name: Lighthouse CI (モバイル)
        id: lhci
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
      - name: スコアを PR にコメント
        if: always() && steps.lhci.outputs.manifest
        uses: actions/github-script@v9
        env:
          MANIFEST: ${{ steps.lhci.outputs.manifest }}
          LINKS: ${{ steps.lhci.outputs.links }}
        with:
          script: |
            const manifest = JSON.parse(process.env.MANIFEST)
            const links = JSON.parse(process.env.LINKS || '{}')
            const r = manifest.find((m) => m.isRepresentativeRun) ?? manifest[0]
            const pct = (v) => `${Math.round(v * 100)}`
            const s = r.summary
            const marker = '<!-- lighthouse-report -->'
            const body = [
              marker,
              '### 📱 Lighthouse（モバイル）',
              '| パフォーマンス | アクセシビリティ | ベストプラクティス | SEO |',
              '|---|---|---|---|',
              `| ${pct(s.performance)} | ${pct(s.accessibility)} | ${pct(s['best-practices'])} | ${pct(s.seo)} |`,
              '',
              Object.values(links)[0] ? `[詳細レポート](${Object.values(links)[0]})` : '',
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const prev = comments.find((c) => c.body?.includes(marker))
            if (prev) await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })
